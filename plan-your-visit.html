		<main>
			<h1>Follow these steps to register for the trail:</h1>
			<ol>
				<li>Fill in your name and email.</li>
				<li>Select which destinations and what day you want to visit.</li>
				<li>Hit "Submit" when finished.</li>
			</ol>

			<form action="https://github.com/jgsielaff/Checkpoint2-Repository" method="GET">
				<p>
				<label for="name">Name:</label>
				<input type="text" name="name" id="name" placeholder="Enter your name..." required>
				</p>

				<p>
				<label for="email">Email:</label>
				<input type="email" name="email" id="email" placeholder="Enter your email..." required>
				</p>
				
				<p>
				<label for="date">Date:</label>
				<input type="date" name="date" id="date" required>
				</p>

				<fieldset>
					<legend>Select the destinations you want to visit</legend>
						<input type="checkbox" name="kelley" id="kelley" checked>
						<label for="kelley">Kelley Country Creamery</label>

						<input type="checkbox" name="sheeps" id="sheeps" checked>
						<label for="sheeps">Sheeps Brewing Company</label>

						<input type="checkbox" name="ellsworth" id="ellsworth" checked>
						<label for="ellsworth">Ellsworth Cooperative Creamery</label>
				</fieldset>
				
				<button type="submit">Submit</button>
			</form>
			
			
		</main>

		<footer>

		</footer>
	</body>
</html>
